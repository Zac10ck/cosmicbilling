<!DOCTYPE html>
<html>
<head>
    <title>Test Login Form</title>
</head>
<body>
    <h1>Test Form</h1>
    <form method="POST">
        <p>
            <label>Username:</label><br>
            <input type="text" name="username" style="width:200px; padding:10px; border:2px solid black;">
        </p>
        <p>
            <label>Password:</label><br>
            <input type="password" name="password" style="width:200px; padding:10px; border:2px solid black;">
        </p>
        <p>
            <button type="submit" style="padding:10px 20px; background:blue; color:white;">Login</button>
        </p>
    </form>
</body>
</html>
